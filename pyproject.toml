[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "app-zen"
version = "1.3.0"
description = "Automacao Total JadLog - leitura, validacao e organizacao de guias, termos e notas fiscais"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "Talita Matias Silva" }]

dependencies = [
    "customtkinter>=5.2.2",
    "pypdf>=4.0.0",
    "pdfplumber>=0.11.0",
    "openpyxl>=3.1.2",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "keyring>=24.3.0",
]

[project.optional-dependencies]
ocr = [
    "pytesseract>=0.3.10",
    "pdf2image>=1.16.3",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
app-zen = "src.app:main"

[tool.setuptools]
packages = [
    "src",
    "src.models",
    "src.repositories",
    "src.services",
    "src.services.ufs",
    "src.states",
    "src.utils",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["checkpoints", "Tesseract-OCR", "__pycache__", ".pytest_cache", ".venv", "_referencia"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "-q --strict-markers"